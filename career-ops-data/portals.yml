# Portal scanner configuration for Punit Alagappan Kasi (user layer).
#
# Used by career-ops' zero-token scanner: `node scan.mjs --since 2 --quiet`.
# The Claude cloud sandbox blocks job-board hosts, so there the daily routine
# discovers postings through the JobDataLake, Indeed and JobsPipe connectors and
# only uses title_filter / location_filter below (via tools/careerops_pipeline.py).
# On a machine with normal internet (Punit's PC) the scanner works as shipped.
# Validate after editing:  node validate-portals.mjs
# Check which boards still answer (needs internet):  node verify-portals.mjs

scan_history:
  recheck_after_days: 45

title_filter:
  positive:
    # Finance analyst families related to the MS in Financial Mathematics.
    # Every family every run; nothing is limited to "risk" or to one title.
    - "Financial Analyst"
    - "Finance Analyst"
    - "Financial Planning"
    - "FP&A"
    - "Corporate Finance"
    - "Business Finance"
    - "Strategic Finance"
    - "Commercial Finance"
    - "Revenue Finance"
    - "Treasury"
    - "Liquidity"
    - "Risk Analyst"
    - "analyst + risk"
    - "Credit Analyst"
    - "analyst + credit"
    - "Underwriting Analyst"
    - "Valuation"
    - "M&A"
    - "Mergers"
    - "Corporate Development"
    - "Transaction Advisory"
    - "Transaction Services"
    - "Deal Advisory"
    - "Investment Banking Analyst"
    - "Investment Analyst"
    - "Equity Research"
    - "Credit Research"
    - "Research Analyst"
    - "Portfolio Analyst"
    - "Portfolio Analytics"
    - "Performance Analyst"
    - "Investment Operations"
    - "Asset Management Analyst"
    - "Quantitative Analyst"
    - "Quantitative Research"
    - "Capital Markets Analyst"
    - "Pricing Analyst"
    - "Profitability"
    - "Analyst Program"
    - "Rotational Program"
    - "Development Program"
    - "Graduate Program"
    - "Analyst Development"
    - "Compliance Analyst"
    - "Regulatory Analyst"
    - "Audit Analyst"
    - "Internal Audit"
    - "Controls Analyst"
    - "Finance Associate"
    - "Finance Rotation"
  negative:
    # Seniority outside the 0-3 year target band.
    - "word:Senior"
    - "word:Sr"
    - "word:Sr."
    - "word:Lead"
    - "word:Principal"
    - "word:Staff"
    - "word:Manager"
    - "word:Director"
    - "word:Head"
    - "Vice President"
    - "word:VP"
    - "word:SVP"
    - "word:EVP"
    - "word:AVP"
    - "word:Chief"
    - "word:Officer"
    - "word:III"
    - "word:IV"
    - "Executive"
    - "Partner"
    # Student placements and non-finance "analyst" jobs.
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Co-op"
    - "Apprentice"
    - "Engineer"
    - "Developer"
    - "Software"
    - "Scientist"
    - "Nurse"
    - "Clinical"
    - "Marketing"
    - "Sales Analyst"
    - "Supply Chain"
    - "Logistics"
    - "Cybersecurity"
    - "Security Analyst"
    - "Systems Analyst"
    - "Business Systems"
    - "Salesforce"
    - "SAP "
    - "Workday Analyst"
    - "Payroll"
    - "Benefits Analyst"
    - "HR Analyst"
    - "Recruiting"
    - "Accountant"
    - "Bookkeeper"
    - "Tax Analyst"
    - "Loan Officer"
    - "Teller"
    - "Collector"
  seniority_boost: []

# Location: he relocates anywhere in the USA at his own expense. Block the
# common foreign hubs; always admit an explicit United States location.
location_filter:
  always_allow:
    - "United States"
    - "USA"
    - "US Remote"
    - "Remote - US"
    - "Remote (US)"
  allow: []
  block:
    - "India"
    - "Bengaluru"
    - "Bangalore"
    - "Mumbai"
    - "Hyderabad"
    - "Pune"
    - "Chennai"
    - "United Kingdom"
    - "London"
    - "Ireland"
    - "Dublin"
    - "Germany"
    - "Berlin"
    - "France"
    - "Paris"
    - "Netherlands"
    - "Amsterdam"
    - "Spain"
    - "Poland"
    - "Singapore"
    - "Hong Kong"
    - "Japan"
    - "Tokyo"
    - "Australia"
    - "Sydney"
    - "Brazil"
    - "Mexico"
    - "Canada"
    - "Toronto"
    - "Vancouver"
    - "Dubai"
    - "Philippines"
    - "Manila"

search_queries:
  - name: Greenhouse and Ashby - finance analyst, United States
    query: 'site:job-boards.greenhouse.io OR site:boards.greenhouse.io OR site:jobs.ashbyhq.com "Financial Analyst" OR "Risk Analyst" OR "Credit Analyst" OR "Treasury Analyst" OR "FP&A" "United States"'
    enabled: true
  - name: Lever - finance analyst, United States
    query: 'site:jobs.lever.co "Financial Analyst" OR "Risk Analyst" OR "Credit Analyst" OR "Investment Analyst" OR "Valuation" "United States"'
    enabled: true
  - name: Workday - entry finance analyst
    query: 'site:myworkdayjobs.com "Financial Analyst" OR "Risk Analyst" OR "Credit Analyst" OR "Treasury Analyst" ("entry level" OR "early career" OR "analyst program")'
    enabled: true
  - name: eFinancialCareers - analyst United States
    query: 'site:efinancialcareers.com "Analyst" ("Risk" OR "Credit" OR "Treasury" OR "Valuation" OR "FP&A") "United States"'
    enabled: true

